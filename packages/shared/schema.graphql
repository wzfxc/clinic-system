type Clinic {
  id: Int!
  city: String!
  name: String!
  timezone: String!
  currency: String!
}

type Service {
  id: Int!
  name: String!
  durationMinutes: Int!
  usesUltrasoundRoom: Boolean!
}

type Doctor {
  id: Int!
  specialty: String!
}

type Patient {
  id: Int!
  fullName: String!
  phone: String
  email: String
}

type Appointment {
  id: Int!
  status: String!
  startsAt: DateTime!
  endsAt: DateTime!
  localDate: String!
  priceMinor: Int!
  currency: String!
  timeVersion: Int!
  holdExpiresAt: DateTime
  doctor: Doctor!
  clinic: Clinic!
  service: Service!
  patient: Patient!
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

type Me {
  userId: Int!
  role: String!
  clinicId: Int
  patientId: Int
  doctorId: Int
}

type SickLeavePayload {
  applied: Boolean!
  cancelledAppointmentIds: [Int!]!
}

type WaitlistOffer {
  id: Int!
  entryId: Int!
  appointmentId: Int!
  clinicId: Int!
  doctorId: Int!
  serviceId: Int!
  startsAt: DateTime!
  endsAt: DateTime!
  expiresAt: DateTime!
  status: String!
}

type WaitlistEntry {
  id: Int!
  clinicId: Int!
  doctorId: Int!
  serviceId: Int!
  dateFrom: String!
  dateTo: String!
  priority: Int!
  status: String!
}

type SlotsChanged {
  clinicId: Int!
  doctorId: Int!
  startsAt: DateTime!
}

type CityFreeSlot {
  clinicId: Int!
  doctorId: Int!
  startAt: DateTime!
  endAt: DateTime!
  localDate: String!
  localTime: String!
  utcOffsetMinutes: Int!
}

type ReportMetrics {
  scheduledMinutes: Int!
  bookedMinutes: Int!

  """Booked minutes over scheduled minutes, 0 to 100."""
  loadPercent: Float!
  completed: Int!
  noShow: Int!

  """no_show / (completed + no_show), 0 to 1."""
  noShowShare: Float!

  """User-side cancellations (system reasons excluded)."""
  cancelled: Int!
  lateCancelled: Int!

  """
  Late cancellations (24 h or less before start) over cancellations, 0 to 1.
  """
  lateCancelShare: Float!
  acceptedOffers: Int!
}

type DoctorReport {
  scheduledMinutes: Int!
  bookedMinutes: Int!

  """Booked minutes over scheduled minutes, 0 to 100."""
  loadPercent: Float!
  completed: Int!
  noShow: Int!

  """no_show / (completed + no_show), 0 to 1."""
  noShowShare: Float!

  """User-side cancellations (system reasons excluded)."""
  cancelled: Int!
  lateCancelled: Int!

  """
  Late cancellations (24 h or less before start) over cancellations, 0 to 1.
  """
  lateCancelShare: Float!
  acceptedOffers: Int!
  doctorId: Int!
  clinicId: Int!
}

type ServiceRevenue {
  serviceId: Int!
  serviceName: String!
  currency: String!

  """Minor currency units (kopecks, groszy) of completed appointments."""
  revenueMinor: Float!
  appointments: Int!
}

type Report {
  fromDate: String!
  toDate: String!
  totals: ReportMetrics!
  doctors: [DoctorReport!]!
  revenue: [ServiceRevenue!]!
}

type Query {
  """The signed-in account."""
  me: Me!

  """The signed-in patient's own appointments."""
  myAppointments(first: Int): [Appointment!]!

  """Appointments visible to the actor, filtered within that scope."""
  appointments(filter: AppointmentFilter, first: Int): [Appointment!]!
  appointment(id: Int!): Appointment

  """Pending and recent waitlist offers for the signed-in patient."""
  myWaitlistOffers: [WaitlistOffer!]!

  """Active waitlist entries for the signed-in patient."""
  myWaitlistEntries: [WaitlistEntry!]!

  """All clinics in the network."""
  clinics: [Clinic!]!

  """All services offered across the network."""
  services: [Service!]!

  """Doctors, optionally filtered by clinic."""
  doctors(clinicId: Int): [Doctor!]!

  """
  Free slots of a service across the doctors of a city for the next 14 days (clinic-local grid, R2 visibility).
  """
  findFreeSlots(city: String!, serviceId: Int!): [CityFreeSlot!]!

  """
  Manager report over the 90 complete days before today (Clock, UTC date).
  """
  managerReport(fromDate: String, toDate: String): Report!
}

input AppointmentFilter {
  patientId: Int
  doctorId: Int
  clinicId: Int
}

type Mutation {
  register(input: RegisterInput!): Me!
  login(email: String!, password: String!): Me!
  logout: Boolean!

  """Places a 10-minute checkout hold for the signed-in patient."""
  holdSlot(input: HoldSlotInput!): Appointment!
  confirmAppointment(appointmentId: Int!, idempotencyKey: String!): Appointment!

  """Cancels a booked or held visit. Patient: own; registrar: own clinic."""
  cancelAppointment(appointmentId: Int!, reason: String!): Appointment!
  rescheduleAppointment(appointmentId: Int!, expectedVersion: Int!, newStartsAt: DateTime!): Appointment!

  """Joins the waitlist; returns the entry id."""
  joinWaitlist(input: JoinWaitlistInput!): Int!
  leaveWaitlist(entryId: Int!): Boolean!
  acceptOffer(offerId: Int!, idempotencyKey: String!): Appointment!
  declineOffer(offerId: Int!): Boolean!

  """Registrar or doctor moves a visit to checked_in, no_show or completed."""
  changeAppointmentStatus(appointmentId: Int!, to: String!): Appointment!

  """Registrar marks a doctor sick for a clinic day."""
  markSickLeave(doctorId: Int!, clinicId: Int!, date: String!): SickLeavePayload!
}

input RegisterInput {
  email: String!
  password: String!
  fullName: String!
  phone: String
}

input HoldSlotInput {
  doctorId: Int!
  clinicId: Int!
  serviceId: Int!
  startsAt: DateTime!
  patientId: Int
}

input JoinWaitlistInput {
  doctorId: Int!
  clinicId: Int!
  serviceId: Int!
  dateFrom: String!
  dateTo: String!
}

type Subscription {
  """
  Free-slot changes of a clinic. Carries no patient or appointment ids; refetch the slot grid.
  """
  slotsChanged(clinicId: Int!): SlotsChanged!
}
