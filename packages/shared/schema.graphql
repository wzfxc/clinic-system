type Clinic {
  id: Int!
  city: String!
  name: String!
  timezone: String!
  currency: String!
}

type Service {
  id: Int!
  name: String!
  durationMinutes: Int!
  usesUltrasoundRoom: Boolean!
}

type Doctor {
  id: Int!
  specialty: String!
}

type Patient {
  id: Int!
  fullName: String!
  phone: String
  email: String
}

type Appointment {
  id: Int!
  status: String!
  startsAt: DateTime!
  endsAt: DateTime!
  localDate: String!
  priceMinor: Int!
  currency: String!
  timeVersion: Int!
  doctor: Doctor!
  clinic: Clinic!
  service: Service!
  patient: Patient!
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

type Me {
  userId: Int!
  role: String!
}

type SickLeavePayload {
  applied: Boolean!
  cancelledAppointmentIds: [Int!]!
}

type SlotsChanged {
  clinicId: Int!
  doctorId: Int!
  startsAt: DateTime!
}

type Query {
  """The signed-in account."""
  me: Me!

  """The signed-in patient's own appointments."""
  myAppointments(first: Int): [Appointment!]!

  """Appointments visible to the actor, filtered within that scope."""
  appointments(filter: AppointmentFilter, first: Int): [Appointment!]!
  appointment(id: Int!): Appointment
}

input AppointmentFilter {
  patientId: Int
  doctorId: Int
  clinicId: Int
}

type Mutation {
  register(input: RegisterInput!): Me!
  login(email: String!, password: String!): Me!
  logout: Boolean!

  """Places a 15-minute checkout hold for the signed-in patient."""
  holdSlot(input: HoldSlotInput!): Appointment!
  confirmAppointment(appointmentId: Int!, idempotencyKey: String!): Appointment!

  """Cancels a booked or held visit. Patient: own; registrar: own clinic."""
  cancelAppointment(appointmentId: Int!, reason: String!): Appointment!
  rescheduleAppointment(appointmentId: Int!, expectedVersion: Int!, newStartsAt: DateTime!): Appointment!

  """Joins the waitlist; returns the entry id."""
  joinWaitlist(input: JoinWaitlistInput!): Int!
  leaveWaitlist(entryId: Int!): Boolean!
  acceptOffer(offerId: Int!, idempotencyKey: String!): Appointment!
  declineOffer(offerId: Int!): Boolean!

  """Registrar or doctor moves a visit to checked_in, no_show or completed."""
  changeAppointmentStatus(appointmentId: Int!, to: String!): Appointment!

  """Registrar marks a doctor sick for a clinic day."""
  markSickLeave(doctorId: Int!, clinicId: Int!, date: String!): SickLeavePayload!
}

input RegisterInput {
  email: String!
  password: String!
  fullName: String!
  phone: String
}

input HoldSlotInput {
  doctorId: Int!
  clinicId: Int!
  serviceId: Int!
  startsAt: DateTime!
}

input JoinWaitlistInput {
  doctorId: Int!
  clinicId: Int!
  serviceId: Int!
  dateFrom: String!
  dateTo: String!
}

type Subscription {
  """
  Free-slot changes of a clinic. Carries no patient or appointment ids; refetch the slot grid.
  """
  slotsChanged(clinicId: Int!): SlotsChanged!
}
